# 日志清洗与分析系统配置
# Log Analyzer System Configuration

spring:
  application:
    name: log-analyzer

  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/log_analyzer?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    com.loganalyzer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{36} - %msg%n"

# Python集成配置 (Py4J)
python:
  gateway:
    port: 25333           # Py4J网关端口
  worker:
    script: python/gateway.py  # Python统一入口脚本
    min-processes: 1      # 最小进程数
    max-processes: 4      # 最大进程数
  interpreter: python3    # Python解释器
